services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    environment:
      - APP_ENV=production
      - DEBUG=false
      - ML_DEVICE=cuda
      - SEMENQ_OCR_DEVICE=cuda
      - SEMENQ_OCR_REQUIRE_VL=1
    gpus: all

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    environment:
      - APP_ENV=production
      - DEBUG=false
      - ML_DEVICE=cuda
      - SEMENQ_OCR_DEVICE=cuda
      - SEMENQ_OCR_REQUIRE_VL=1
    gpus: all
